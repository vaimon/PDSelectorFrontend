server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: unknown paths resolve to index.html so client-side routing works. /api and /oauth2
    # are handled by the edge nginx (teams.pd-mmcs.ru), never reach this container.
    location / {
        try_files $uri $uri/ /index.html;
        # Force revalidation of index.html so a redeploy's content-hashed /assets chunks are
        # never referenced by a stale cached HTML (which would 404 to a blank page).
        add_header Cache-Control "no-cache";
    }

    # Vite emits content-hashed filenames under /assets — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
